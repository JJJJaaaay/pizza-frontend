<div class="login-wrapper">
  <div class="animated-bg">
    <div class="pizza-particle"></div>
    <div class="pizza-particle"></div>
    <div class="pizza-particle"></div>
    <div class="pizza-particle"></div>
    <div class="pizza-particle"></div>
  </div>

  <div class="login-container animate-slide-up">
    <div class="login-card">
    
      <div class="brand-section">
        <div class="logo-wrapper animate-bounce-in">
          <div class="pizza-logo">🍕</div>
        </div>
        <h1 class="brand-title animate-fade-in">Chel's <span class="highlight">Pizza</span></h1>
        <p class="brand-subtitle animate-fade-in-delay">Basta masarap na Pizza, kay sir Renz lang yan!</p>
      </div>

      
      <div class="divider animate-fade-in-delay2">
        <span class="divider-line"></span>
        <span class="divider-icon">✦</span>
        <span class="divider-line"></span>
      </div>

      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        
        <div class="input-group animate-slide-in-left">
          <div class="input-icon">
            <i class="pi pi-user"></i>
          </div>
          <div class="input-field">
            <input 
              type="text" 
              pInputText 
              formControlName="username" 
              placeholder=" "
              class="modern-input">
            <label>Username</label>
          </div>
        </div>

        
        <div class="input-group animate-slide-in-right">
          <div class="input-icon">
            <i class="pi pi-lock"></i>
          </div>
          <div class="input-field">
            <input 
              type="password" 
              pInputText 
              formControlName="password" 
              placeholder=" "
              class="modern-input">
            <label>Password</label>
          </div>
        </div>

        
        <div class="login-options animate-fade-in">
          <label class="checkbox-container">
            <input type="checkbox">
            <span class="checkmark"></span>
            <span class="checkbox-text">Tandaan ko password mo ya</span>
          </label>
          <a href="#" class="forgot-link">Nakalimutan mo na naman?</a>
        </div>

        
        <button 
          pButton 
          type="submit" 
          label="Sign In" 
          icon="pi pi-sign-in" 
          [loading]="loading"
          class="login-btn animate-scale"
          [disabled]="loading">
          <span class="btn-text">Sign In</span>
          <span class="btn-icon">→</span>
        </button>

        
        <div class="register-section animate-fade-in-delay2">
          <p>Bago ka lang ba?</p>
          <a routerLink="/register" class="register-link-btn">Ge, gawa ka dito</a>
        </div>
      </form>
    </div>
  </div>
</div>
